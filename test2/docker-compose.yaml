services:
  controller1:
    image: apache/kafka:4.0.1
    container_name: controller1
    hostname: controller1
    ports:
      - "29091:29091"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      CLUSTER_ID: "5tOLArBHTI-H9yT1Cl87FQ"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://controller1:29091
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
#      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://controller1:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:29091
      #KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      #KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      #KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      #KAFKA_LOG_DIRS: /kafka/data
    volumes:
      - ./kafka/controller1/data:/kafka/data
    networks:
      bigdata:
        ipv4_address: 172.20.0.2
  broker1:
    image: apache/kafka:4.0.1
    container_name: broker1
    hostname: broker1
    ports:
      - "29094:29094"
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      CLUSTER_ID: "5tOLArBHTI-H9yT1Cl87FQ"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_LISTENERS: BROKER://broker1:29094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: BROKER://broker1:29094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:29091
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      #KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      #KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      #KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      #KAFKA_LOG_DIRS: /kafka/data
    volumes:
      - ./kafka/controller1/data:/kafka/data
    networks:
      bigdata:
        ipv4_address: 172.20.0.3
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker1:29094"
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      bigdata:
        ipv4_address: 172.20.0.4
    depends_on:
      - broker1
networks:
  bigdata:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1