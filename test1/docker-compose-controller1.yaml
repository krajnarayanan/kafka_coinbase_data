services:
  controller1:
    image: apache/kafka:3.7.1
    container_name: controller1
    environment:
      - KAFKA_NODE_ID=1 
      - CLUSTER_ID=9H5maLq_RJOYX2B4Cm8CIg 
      - KAFKA_PROCESS_ROLES=controller 
      - KAFKA_LISTENERS=CONTROLLER://localhost:29091 
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER 
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT 
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:29091,2@localhost:29092,3@localhost:29093   
    networks:
      bigata_network:
        ipv4_address: 172.20.0.2

      
  controller2:
    image: apache/kafka:3.7.1
    container_name: controller2
    environment:
      - KAFKA_NODE_ID=2 
      - CLUSTER_ID=9H5maLq_RJOYX2B4Cm8CIg 
      - KAFKA_PROCESS_ROLES=controller 
      - KAFKA_LISTENERS=CONTROLLER://localhost:29092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER 
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT 
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:29091,2@localhost:29092,3@localhost:29093   
    networks:
      bigata_network:
        ipv4_address: 172.20.0.3

  controller3:
    image: apache/kafka:3.7.1
    container_name: controller3
    environment:
      - KAFKA_NODE_ID=3
      - CLUSTER_ID=9H5maLq_RJOYX2B4Cm8CIg 
      - KAFKA_PROCESS_ROLES=controller 
      - KAFKA_LISTENERS=CONTROLLER://localhost:29093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER 
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT 
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:29091,2@localhost:29092,3@localhost:29093
    networks:
      bigata_network:
        ipv4_address: 172.20.0.4
networks:
  bigata_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway:  172.20.0.1