services:
  broker3:
    image: apache/kafka:3.7.1
    container_name: broker3
    environment:
    - KAFKA_NODE_ID=6
    - CLUSTER_ID=9H5maLq_RJOYX2B4Cm8CIg 
    - KAFKA_PROCESS_ROLES=broker 
    - KAFKA_LISTENERS=BROKER://localhost:29096
    - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://broker3:29092,BROKER://localhost:29096
    - KAFKA_INTER_BROKER_LISTENER_NAME=BROKER 
    - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER 
    - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:29091,2@localhost:29092,3@localhost:29093         
    networks:
      bigata_network:
        ipv4_address: 172.20.0.7
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bigata-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker1:29092,broker2:29092,broker3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      bigata_network:
        ipv4_address: 172.20.0.8

networks:
  bigata_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway:  172.20.0.1